# .github/workflows/gen-keystore.yml
name: Generate Android Keystore
on:
  workflow_dispatch:
    inputs:
      alias:
        description: 'Key Alias'
        required: true
        default: 'my-alias'
      password:
        description: 'Keystore & Key Password'
        required: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Generate Keystore
        run: |
          keytool -genkeypair -v \
            -keystore release.jks \
            -storetype JKS \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias ${{ github.event.inputs.alias }} \
            -storepass ${{ github.event.inputs.password }} \
            -keypass ${{ github.event.inputs.password }} \
            -dname "CN=EnglishTutor, OU=Mobile, O=AI, L=City, ST=State, C=US"
          
          echo "----- BASE64 START -----"
          base64 -w 0 release.jks
          echo ""
          echo "----- BASE64 END -----"