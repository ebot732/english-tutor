name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  GRADLE_USER_HOME: ${{ github.workspace }}/.gradle

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'

      - name: Create Gradle init script to use Google Maven Central mirror
        run: |
          mkdir -p $GRADLE_USER_HOME/init.d
          cat > $GRADLE_USER_HOME/init.d/google-maven-mirror.gradle <<'EOF'
          def mirrorUrl = "https://maven-central.storage-download.googleapis.com/maven2/"
          settingsEvaluated { settings ->
              settings.pluginManagement.repositories {
                  maven { url = mirrorUrl; name = "GoogleMavenMirror" }
                  gradlePluginPortal()
              }
              settings.dependencyResolutionManagement.repositories {
                  maven { url = mirrorUrl; name = "GoogleMavenMirror" }
                  google()
              }
          }
          EOF

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.GRADLE_USER_HOME }}/caches
            ${{ env.GRADLE_USER_HOME }}/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Decode Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android-release.jks

      - name: Build APK
        run: |
          flet build apk \
            --yes \
            --android-signing-key-store ${{ github.workspace }}/android-release.jks \
            --android-signing-key-store-password "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            --android-signing-key-alias "${{ secrets.ANDROID_KEY_ALIAS }}" \
            --android-signing-key-password "${{ secrets.ANDROID_KEY_PASSWORD }}" \
            --verbose

      - name: Rename APK
        run: |
          mv build/apk/app-release.apk build/apk/english-tutor.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EnglishTutor-APK
          path: build/apk/*.apk
