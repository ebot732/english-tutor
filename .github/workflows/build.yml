name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build APK with record_linux fix
        run: |
          flet build apk --permissions microphone --verbose || (find /home/runner/.pub-cache -name "record_linux.dart" -exec sed -i 's/Future<bool> hasPermission(String recorderId)/Future<bool> hasPermission(String recorderId, {bool request = true})/g' {} + && flet build apk --permissions microphone --verbose)

          

      - name: Rename APK
        run: |
          mv build/apk/app-release.apk build/apk/english-tutor.apk
          
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EnglishTutor-APK
          path: build/apk/*.apk
