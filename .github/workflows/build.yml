name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Decode Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android-release.jks

      - name: Build APK
        run: |
          flet build apk \
            --yes \
            --android-signing-key-store android-release.jks \
            --android-signing-key-store-password "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            --android-signing-key-alias "${{ secrets.ANDROID_KEY_ALIAS }}" \
            --android-signing-key-password "${{ secrets.ANDROID_KEY_PASSWORD }}" \
            --verbose

      - name: Rename APK
        run: |
          mv build/apk/app-release.apk build/apk/english-tutor.apk
          
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EnglishTutor-APK
          path: build/apk/*.apk
