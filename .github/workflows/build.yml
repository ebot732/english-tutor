name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Позволяет запускать сборку вручную кнопкой на сайте GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Скачиваем код из репозитория
        uses: actions/checkout@v4

      - name: Устанавливаем Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Устанавливаем Java (нужна для Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Устанавливаем Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Устанавливаем зависимости Python и Flet
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Собираем APK
        run: |
          flet build apk --project "EnglishTutor" --org "com.example.tutor"

      - name: Загружаем готовый APK в артефакты
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/apk/*.apk
