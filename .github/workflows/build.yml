name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  GRADLE_USER_HOME: ${{ github.workspace }}/.gradle
  FLET_CACHE_DIR: ${{ github.workspace }}/.flet-cache

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'

      - name: Clear Flet and Gradle caches
        run: |
          rm -rf $FLET_CACHE_DIR
          rm -rf $GRADLE_USER_HOME/caches
          echo "Caches cleared."

      - name: Create Gradle init script to use Google Maven Central mirror
        run: |
          mkdir -p $GRADLE_USER_HOME/init.d
          cat > $GRADLE_USER_HOME/init.d/google-maven-mirror.gradle <<'EOF'
          def mirrorUrl = "https://maven-central.storage-download.googleapis.com/maven2/"
          settingsEvaluated { settings ->
              settings.pluginManagement.repositories {
                  maven { url = mirrorUrl; name = "GoogleMavenMirror" }
                  gradlePluginPortal()
              }
              settings.dependencyResolutionManagement.repositories {
                  maven { url = mirrorUrl; name = "GoogleMavenMirror" }
                  google()
              }
          }
          EOF

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.GRADLE_USER_HOME }}/caches
            ${{ env.GRADLE_USER_HOME }}/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Decode Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android-release.jks

      - name: Build APK
        run: |
          flet build apk \
            --yes \
            --python-version 3.12 \
            --arch arm64-v8a
            --android-signing-key-store ${{ github.workspace }}/android-release.jks \
            --android-signing-key-store-password "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            --android-signing-key-alias "${{ secrets.ANDROID_KEY_ALIAS }}" \
            --android-signing-key-password "${{ secrets.ANDROID_KEY_PASSWORD }}" \
            --verbose

      - name: Locate and copy APK
        run: |
          echo "=== Searching for APK files ==="
          find build -name "*.apk" -type f
          
          APK_SRC=$(find build -name "app-release.apk" -type f | head -n 1)
          if [ -z "$APK_SRC" ]; then
            APK_SRC=$(find build -name "*.apk" -type f | head -n 1)
          fi
          
          if [ -z "$APK_SRC" ]; then
            echo "❌ APK file not found!"
            exit 1
          fi
          
          echo "✅ Found APK: $APK_SRC"
          mkdir -p build/apk
          cp "$APK_SRC" build/apk/english-tutor.apk
          ls -lh build/apk/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EnglishTutor-APK
          path: build/apk/english-tutor.apk
