name: Build Android APK

on:
  workflow_dispatch: # Запуск вручную по кнопке на сайте
  push:              # Или автоматический запуск при обновлении кода
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Скачиваем код из репозитория
        uses: actions/checkout@v4

      - name: Настраиваем Python 3.11 в облаке
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Настраиваем Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Настраиваем Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Устанавливаем Flet
        run: |
          python -m pip install --upgrade pip
          pip install flet

      - name: Собираем APK
        run: |
          flet build apk --permissions android.permission.RECORD_AUDIO android.permission.INTERNET

      - name: Сохраняем готовый APK для скачивания
        uses: actions/upload-artifact@v4
        with:
          name: AutoEnglish-APK
          path: build/apk/app-release.apk
