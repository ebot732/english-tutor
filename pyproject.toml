[project]
name = "EnglishTutor"
version = "1.4"
description = "AI English Tutor with Voice and Dictionary"
requires-python = ">=3.12"
dependencies = [
    "flet==0.28.3",
    "flet-audio",
    "flet-sherpa-onnx", # Версия будет установлена отдельно
    "pyjnius"
]

[tool.flet]
org = "com.aitutor"
product = "English Tutor"
build_number = 5

[tool.flet.android]
permissions = ["android.permission.RECORD_AUDIO"]
extract_packages = ["flet_sherpa_onnx"]
