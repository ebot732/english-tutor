[project]
name = "EnglishTutor"
version = "1.9"
description = "AI English Tutor with Voice and Dictionary"
requires-python = ">=3.12"
dependencies = [
    "flet>=1.1.2",
    "flet-audio>=1.1.2",
    "flet-audio-recorder>=1.1.0",
    "SpeechRecognition",
    "httpx",
    "pyjnius"
]

[tool.flet]
org = "com.aitutor"
product = "English Tutor"
build_number = 15

[tool.flet.android]
min_sdk_version = 24
extract_packages = ["speech_recognition"]
build_arch = ["arm64-v8a"]

[tool.flet.android.permission]
"android.permission.INTERNET" = true
"android.permission.RECORD_AUDIO" = true
"android.permission.MODIFY_AUDIO_SETTINGS" = true
