[project]
name = "EnglishTutor"
version = "1.4"
description = "AI English Tutor with Voice and Dictionary"
requires-python = ">=3.10"
dependencies = [
    "flet==0.28.3",
    "flet-audio",
    "flet-audio-recorder==0.1.0",
    "SpeechRecognition",
    "pyjnius"
]

[tool.flet]
org = "com.aitutor"
product = "English Tutor"
build_number = 5

# Подключаем Flutter-плагин записи звука
[tool.flet.flutter.dependencies]
flet_audio_recorder = "0.1.0"

# Указываем minSdkVersion 23, иначе record_android не соберётся
[tool.flet.android]
min_sdk_version = 23

# Явно задаём разрешения для микрофона
[tool.flet.android.permission]
"android.permission.RECORD_AUDIO" = true
"android.permission.MODIFY_AUDIO_SETTINGS" = true
