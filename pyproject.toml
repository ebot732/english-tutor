[project]
name = "EnglishTutor"
version = "1.4"
description = "AI English Tutor with Voice and Dictionary"
requires-python = ">=3.10"
dependencies = [
    "flet==0.28.3",
    "flet-audio",
    "flet-audio-recorder",
    "SpeechRecognition",
    "pyjnius"
]

[tool.flet]
org = "com.aitutor"
product = "English Tutor"
build_number = 5

# Указываем Flutter-плагины, которые нужно включить в сборку
[tool.flet.flutter.dependencies]
flet_audio_recorder = "0.1.0" # или версия, совместимая с вашим Flet 0.28.3

# Явно задаём разрешения для Android
[tool.flet.android.permission]
"android.permission.RECORD_AUDIO" = true
"android.permission.MODIFY_AUDIO_SETTINGS" = true
