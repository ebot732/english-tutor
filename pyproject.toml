[project]
name = "EnglishTutor"
version = "1.4"
description = "AI English Tutor with Voice and Dictionary"
requires-python = ">=3.10"
dependencies = [
    "flet==0.28.3",
    "flet-audio",
    "flet-stt",
    "pyjnius"
]

[tool.flet]
org = "com.aitutor"
product = "English Tutor"
build_number = 5

[tool.flet.android]
permissions = ["android.permission.RECORD_AUDIO"]

[tool.flet.app]
exclude = ["flet_stt"]

[tool.flet.dev_packages]
flet-stt = "flet_stt"