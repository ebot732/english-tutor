[project]
name = "EnglishTutor"
version = "1.4"
description = "AI English Tutor with Voice and Dictionary"
requires-python = ">=3.10"
dependencies = [
    "flet==0.28.3",
    "flet-audio",
    "flet-audio-recorder",
    "SpeechRecognition",
    "pyjnius"
]

[tool.flet]
org = "com.aitutor"
product = "English Tutor"
build_number = 5

[tool.flet.android]
permissions = ["android.permission.RECORD_AUDIO"]
