[project]
name = "EnglishTutor"
version = "1.5"
description = "AI English Tutor with Voice and Dictionary"
requires-python = ">=3.12"
dependencies = [
    "flet>=1.1.2",
    "flet-audio>=1.1.2",
    "flet-audio-recorder>=1.0.0",
    "SpeechRecognition",
    "pyjnius"
]

[tool.flet]
org = "com.aitutor"
product = "English Tutor"
build_number = 9

[tool.flet.android]
min_sdk_version = 24
# Пакет SpeechRecognition не умеет читать данные из ZIP, поэтому распаковываем его на диск
extract_packages = ["speech_recognition"]

[tool.flet.android.permission]
"android.permission.RECORD_AUDIO" = true
"android.permission.MODIFY_AUDIO_SETTINGS" = true
